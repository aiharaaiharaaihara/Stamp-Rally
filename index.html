<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スタンプラリー</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f5f5f5;
  padding: 20px;
}

h1 {
  margin-bottom: 25px;
}

.question {
  margin: 15px auto;
  max-width: 400px;
}

input {
  width: 90%;
  padding: 12px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  margin-top: 20px;
  padding: 12px 30px;
  font-size: 18px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: white;
}

#error {
  color: red;
  margin-top: 20px;
}

#clear {
  display: none;
  margin-top: 30px;
}

#clear img {
  width: 90%;
  max-width: 400px;
}
</style>
</head>

<body>

<h1>🎫 スタンプラリー</h1>

<p>6つの答えを入力してください！</p>

<div class="question">
  <p>①</p>
  <input id="answer1" type="text">
</div>

<div class="question">
  <p>②</p>
  <input id="answer2" type="text">
</div>

<div class="question">
  <p>③</p>
  <input id="answer3" type="text">
</div>

<div class="question">
  <p>④</p>
  <input id="answer4" type="text">
</div>

<div class="question">
  <p>⑤</p>
  <input id="answer5" type="text">
</div>

<div class="question">
  <p>⑥</p>
  <input id="answer6" type="text">
</div>

<button onclick="checkAnswers()">答え合わせ</button>

<p id="error"></p>

<div id="clear">
  <h2>🎉 CLEAR！🎉</h2>
  <p>全問正解です！</p>
  <img src="https://placehold.co/600x400?text=CLEAR%21" alt="CLEAR">
</div>

<script>
function checkAnswers() {

  const answers = [
    "ねこ",
    "りんご",
    "東京",
    "3D",
    "学校",
    "1234"
  ];

  let correct = true;

  for (let i = 1; i <= 6; i++) {
    const input = document.getElementById("answer" + i).value.trim();

    if (input !== answers[i - 1]) {
      correct = false;
    }
  }

  if (correct) {
    document.getElementById("error").textContent = "";
    document.getElementById("clear").style.display = "block";
  } else {
    document.getElementById("error").textContent =
      "❌ まだ間違っている答えがあります。もう一度確認してください！";
    document.getElementById("clear").style.display = "none";
  }
}
</script>

</body>
</html>
